<text x="80" y="1049" font-size="17" fill="#647475" font-weight="400" text-anchor="start" class="">来源：最终 report.json 与 60 份 results；24 小时经营窗口含后续订单结算。公开合成、同分布新 seed，不代表真实店铺或全年收益。</text>
