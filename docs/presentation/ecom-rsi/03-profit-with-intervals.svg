<text x="80" y="140" font-size="54" fill="#183134" font-weight="400" text-anchor="start" class="title">冻结候选提高了收益，但不是每次都赢</text>
<text x="80" y="187" font-size="25" fill="#647475" font-weight="400" text-anchor="start" class="">固定模型、固定双臂、新 seed；区间按 seed 聚类计算，不把同一 seed 的重复当作独立样本。</text>
