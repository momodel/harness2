<text x="104" y="926" font-size="24" fill="#183134" font-weight="400" text-anchor="start" class="">共享的是前序经验；表中每次文件差异都相对固定 Base。利润差来自各自任务，不能当作版本升级曲线。</text>
<path d="M80 980L1840 980" fill="none" stroke="#D8DED6" stroke-width="1.5" stroke-linejoin="round"  />
<text x="80" y="1015" font-size="20" fill="#647475" font-weight="400" text-anchor="start" class="">利润差 = 本任务最终净利润 − Base 净利润，单位为模拟货币；缺失不记为 0，回退不算成功改进。</text>
<text x="80" y="1049" font-size="17" fill="#647475" font-weight="400" text-anchor="start" class="">来源：train.json 的任务顺序、各任务 summary 与实际候选文件、原生 measurement；改动不构成单规则因果归因。</text>
