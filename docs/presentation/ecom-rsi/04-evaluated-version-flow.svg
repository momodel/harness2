<text x="80" y="140" font-size="54" fill="#183134" font-weight="400" text-anchor="start" class="title">最终评估的，是哪一个版本？</text>
<text x="80" y="187" font-size="25" fill="#647475" font-weight="400" text-anchor="start" class="">把自动生成、人工工程筛选、快照冻结与独立评估分开，才能追溯最后一个数字。</text>
