<text x="1483" y="442" font-size="21" fill="#183134" font-weight="400" text-anchor="start" class="">新 seed 1000–1009</text>
<text x="1483" y="476" font-size="21" fill="#183134" font-weight="400" text-anchor="start" class="">每 seed 重复 3 次</text>
<text x="1483" y="510" font-size="21" fill="#183134" font-weight="400" text-anchor="start" class="">30 对 / 60 次完整执行</text>
<text x="1483" y="544" font-size="21" fill="#183134" font-weight="400" text-anchor="start" class="">无提案、选择、反思写回</text>
<text x="1483" y="578" font-size="21" fill="#183134" font-weight="400" text-anchor="start" class="">每次使用新的经营状态</text>
