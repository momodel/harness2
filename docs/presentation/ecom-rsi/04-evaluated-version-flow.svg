<text x="1153" y="819" font-size="17" fill="#647475" font-weight="400" text-anchor="start" class="mono">base · 471dfcf713d09935</text>
<path d="M1415 790H1652V698" fill="none" stroke="#879391" stroke-width="3" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<rect x="80" y="885" width="1760" height="65" rx="5" fill="#FFFFFF" stroke="#D8DED6"/>
<text x="104" y="926" font-size="24" fill="#183134" font-weight="400" text-anchor="start" class="">k=1 时 c1 是唯一最终候选，无额外 selector 会话。冻结后的试跑与续跑未改变候选，也未继续训练。</text>
<path d="M80 980L1840 980" fill="none" stroke="#D8DED6" stroke-width="1.5" stroke-linejoin="round"  />
<text x="80" y="1015" font-size="20" fill="#647475" font-weight="400" text-anchor="start" class="">源指纹与冻结指纹因标准物化不同；已核对有效可编辑内容相同。最终评估的是一个候选，不是所有训练版本。</text>
<text x="80" y="1049" font-size="17" fill="#647475" font-weight="400" text-anchor="start" class="">来源：seed15 summary 与实际候选、DIAGNOSIS、freeze-provenance、plan、evaluation-status；完整指纹与来源见 evidence.json。</text>
